name: Android Release Build & Telegram Delivery

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository 
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify Release Keystore
        run: |
          if [ -f "@ndroid.jks" ]; then
            echo "Found @ndroid.jks keystore in repository."
          else
            echo "Warning: @ndroid.jks not found, creating fallback keystore..."
            keytool -genkey -v -keystore @ndroid.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "${{ secrets.KEY_PASS || 'android' }}" -keypass "${{ secrets.KEY_PASS || 'android' }}" -dname "CN=Release, OU=Android, O=App, L=City, ST=State, C=US"
          fi

      - name: Build Release APK (arm64-v8a)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/@ndroid.jks
          STORE_PASSWORD: ${{ secrets.KEY_PASS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease --stacktrace

      - name: Locate Built ARM64 APK
        id: locate_apk
        run: |
          # Priority to arm64-v8a APK from splits
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*arm64-v8a*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "Release APK file not found!"
            exit 1
          fi
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV
          echo "Found Release APK at: $APK_FILE"

      - name: Send APK File to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x .github/scripts/send_telegram.sh
          .github/scripts/send_telegram.sh
